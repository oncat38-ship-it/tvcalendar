<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マイ TV 予定表</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons & Google Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Quicksand', 'Noto Sans JP', 'sans-serif'],
          },
          colors: {
            pastel: {
              bg: '#fffbfb',
              card: '#ffffff',
              primary: '#f472b6', /* Pink */
              primaryHover: '#db2777',
              secondary: '#a78bfa', /* Purple */
              accent: '#fb7185',
              softPink: '#fdf2f8',
              softPurple: '#f5f3ff',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #fffafb;
      color: #4b5563;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #fdf2f8;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #fbcfe8;
      border-radius: 4px;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col font-sans antialiased selection:bg-pink-200 selection:text-pink-900 text-xs">

  <!-- AUTH SCREEN (LOGIN / REGISTER with Custom ID) -->
  <div id="auth-screen" class="fixed inset-0 bg-gradient-to-br from-pink-50 via-purple-50 to-rose-50 z-50 flex items-center justify-center p-4">
    <div class="bg-white/90 backdrop-blur-md p-8 rounded-3xl shadow-xl border border-pink-100 w-full max-w-sm space-y-5 text-center">
      <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-pink-400 to-purple-400 flex items-center justify-center text-white mx-auto shadow-md shadow-pink-200">
        <i class="fa-solid fa-tv text-xl"></i>
      </div>
      <div>
        <h2 class="text-base font-bold text-slate-700">マイ TV 予定表</h2>
        <p class="text-[11px] text-slate-400 mt-1">お気に入りの番組を可愛くスマートに管理</p>
      </div>

      <form id="auth-form" onsubmit="handleAuth(event)" class="space-y-3 text-left">
        <div>
          <label class="block text-[11px] font-bold text-slate-600 mb-1">ログインID (自由な文字列)</label>
          <input type="text" id="auth-username" required placeholder="例: my_tv_user" class="w-full bg-pink-50/40 border border-pink-200/80 rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-pink-400 focus:bg-white outline-none transition">
        </div>

        <div>
          <label class="block text-[11px] font-bold text-slate-600 mb-1">パスワード</label>
          <input type="password" id="auth-password" required minlength="6" placeholder="6文字以上" class="w-full bg-pink-50/40 border border-pink-200/80 rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-pink-400 focus:bg-white outline-none transition">
        </div>

        <div id="auth-error" class="text-rose-500 text-[10px] hidden font-medium text-center"></div>

        <button type="submit" id="auth-submit-btn" class="w-full bg-gradient-to-r from-pink-400 to-purple-400 hover:from-pink-500 hover:to-purple-500 text-white font-bold py-2.5 rounded-xl text-xs shadow-md shadow-pink-200 transition">
          ログイン
        </button>
      </form>

      <div class="pt-2 border-t border-pink-50">
        <button onclick="toggleAuthMode()" id="auth-toggle-btn" class="text-[11px] font-medium text-pink-500 hover:underline">
          アカウントをお持ちでない方は新規登録
        </button>
      </div>
    </div>
  </div>

  <!-- MAIN APP CONTAINER -->
  <div id="app-container" class="hidden min-h-screen flex flex-col">
    <!-- Header Section -->
    <header class="bg-white/80 backdrop-blur-md border-b border-pink-100 sticky top-0 z-30">
      <div class="max-w-4xl mx-auto px-4">
        <div class="flex items-center justify-between h-14">
          <!-- Logo / Title -->
          <div class="flex items-center space-x-2.5">
            <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-pink-400 to-purple-400 flex items-center justify-center text-white shadow-xs">
              <i class="fa-solid fa-tv text-sm"></i>
            </div>
            <span class="text-sm font-bold text-slate-700 tracking-tight">マイ TV 予定表</span>
          </div>

          <!-- Mode Toggle & Add Button -->
          <div class="flex items-center space-x-2">
            <!-- View Switcher Tabs -->
            <div class="bg-pink-50 p-0.5 rounded-xl flex text-[11px] font-medium text-slate-600 border border-pink-100/60">
              <button id="view-calendar-btn" onclick="switchView('calendar')" class="px-3 py-1 rounded-lg transition-all flex items-center gap-1.5 bg-white text-pink-600 shadow-xs font-bold">
                <i class="fa-regular fa-calendar-days"></i>
                <span>カレンダー</span>
              </button>
              <button id="view-table-btn" onclick="switchView('table')" class="px-3 py-1 rounded-lg transition-all flex items-center gap-1.5 hover:text-slate-900">
                <i class="fa-solid fa-list-check"></i>
                <span>リスト表</span>
              </button>
            </div>

            <!-- Talent Mgmt Button -->
            <button onclick="openTalentModal()" class="border border-pink-200 bg-white hover:bg-pink-50/50 text-slate-600 px-2.5 py-1.5 rounded-xl text-xs font-medium transition flex items-center gap-1">
              <i class="fa-regular fa-user text-pink-400"></i>
              <span class="hidden sm:inline">タレント</span>
            </button>

            <!-- Add Schedule Button -->
            <button onclick="openModal()" class="bg-gradient-to-r from-pink-400 to-purple-400 hover:from-pink-500 hover:to-purple-500 text-white px-3.5 py-1.5 rounded-xl text-xs font-bold shadow-sm shadow-pink-200 transition flex items-center gap-1">
              <i class="fa-solid fa-plus text-[10px]"></i>
              <span>追加</span>
            </button>

            <!-- Logout Button -->
            <button onclick="handleLogout()" title="ログアウト" class="text-slate-400 hover:text-rose-500 p-1.5 rounded-xl transition">
              <i class="fa-solid fa-right-from-bracket text-sm"></i>
            </button>
          </div>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-4xl w-full mx-auto px-4 py-4 space-y-4">

      <!-- CALENDAR VIEW -->
      <section id="calendar-view" class="space-y-3">
        <div class="bg-white p-3.5 rounded-2xl border border-pink-100 shadow-xs flex items-center justify-between">
          <div class="flex items-center space-x-3">
            <h2 id="calendar-month-year" class="text-sm font-bold text-slate-700"></h2>
            <div class="flex items-center bg-pink-50/60 rounded-xl p-0.5 text-[11px] text-slate-600 border border-pink-100">
              <button onclick="prevMonth()" class="px-2.5 py-1 rounded-lg hover:bg-white transition"><i class="fa-solid fa-chevron-left"></i></button>
              <button onclick="todayMonth()" class="px-2.5 py-1 font-bold hover:bg-white transition">今月</button>
              <button onclick="nextMonth()" class="px-2.5 py-1 rounded-lg hover:bg-white transition"><i class="fa-solid fa-chevron-right"></i></button>
            </div>
          </div>

          <div class="flex items-center gap-3 text-[11px] font-medium text-slate-500">
            <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-pink-400 inline-block"></span>毎週</span>
            <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-purple-400 inline-block"></span>単発/SP</span>
          </div>
        </div>

        <div class="bg-white rounded-2xl border border-pink-100 shadow-xs overflow-hidden">
          <div class="grid grid-cols-7 border-b border-pink-100 bg-pink-50/30 text-center text-[11px] font-bold text-slate-600 py-2">
            <span class="text-rose-400">日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span class="text-sky-400">土</span>
          </div>
          <div id="calendar-grid" class="grid grid-cols-7 auto-rows-fr divide-x divide-y divide-pink-50 min-h-[480px]"></div>
        </div>
      </section>

      <!-- TABLE VIEW -->
      <section id="table-view" class="space-y-3 hidden">
        <div class="bg-white p-3 rounded-2xl border border-pink-100 shadow-xs flex flex-wrap gap-2 items-center justify-between">
          <div class="relative w-full sm:w-64">
            <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-pink-300 text-[11px]"></i>
            <input type="text" id="table-search" oninput="renderTable()" placeholder="番組名やタレントで検索..." 
                   class="w-full pl-8 pr-3 py-1.5 bg-pink-50/30 border border-pink-200/80 rounded-xl text-xs focus:outline-none focus:ring-1 focus:ring-pink-400 focus:bg-white transition">
          </div>

          <div class="flex items-center gap-2">
            <select id="table-filter-type" onchange="renderTable()" class="bg-pink-50/30 border border-pink-200/80 text-xs text-slate-600 rounded-xl px-3 py-1.5 focus:outline-none focus:ring-1 focus:ring-pink-400">
              <option value="all">すべての番組</option>
              <option value="weekly">毎週の番組</option>
              <option value="once">単発・SP番組</option>
            </select>
          </div>
        </div>

        <div class="bg-white rounded-2xl border border-pink-100 shadow-xs overflow-hidden">
          <div class="overflow-x-auto custom-scrollbar">
            <table class="w-full text-left text-xs border-collapse">
              <thead class="bg-pink-50/30 border-b border-pink-100 text-slate-500 font-bold">
                <tr>
                  <th class="py-2.5 px-3.5 w-32">放送日時</th>
                  <th class="py-2.5 px-3.5">番組名</th>
                  <th class="py-2.5 px-3.5">出演者</th>
                  <th class="py-2.5 px-3.5">備考</th>
                  <th class="py-2.5 px-3.5 w-16 text-right">操作</th>
                </tr>
              </thead>
              <tbody id="table-body" class="divide-y divide-pink-50 text-slate-700"></tbody>
            </table>
          </div>
        </div>
      </section>

    </main>
  </div>

  <!-- ADD / EDIT SCHEDULE MODAL -->
  <div id="modal-backdrop" class="fixed inset-0 bg-slate-900/20 backdrop-blur-xs z-50 flex items-center justify-center p-3 opacity-0 pointer-events-none transition-opacity duration-200">
    <div id="modal-panel" class="bg-white rounded-3xl shadow-xl border border-pink-100 w-full max-w-sm overflow-hidden transform scale-95 transition-all duration-200">
      <div class="px-5 py-3.5 border-b border-pink-100 flex items-center justify-between bg-pink-50/30">
        <h3 id="modal-title" class="font-bold text-slate-700 text-xs">新しい番組予定を追加</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 w-6 h-6 rounded-full flex items-center justify-center hover:bg-pink-100/50 transition">
          <i class="fa-solid fa-xmark text-xs"></i>
        </button>
      </div>

      <form id="schedule-form" onsubmit="handleFormSubmit(event)" class="p-5 space-y-3.5">
        <input type="hidden" id="entry-id">

        <div>
          <div class="grid grid-cols-2 gap-2">
            <label class="cursor-pointer">
              <input type="radio" name="entry-type" value="weekly" checked onchange="toggleTypeFields('weekly')" class="peer sr-only">
              <div class="text-center py-1.5 text-xs font-bold border border-pink-200 rounded-xl peer-checked:bg-pink-400 peer-checked:text-white peer-checked:border-pink-400 transition text-slate-600">
                毎週の番組
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="entry-type" value="once" onchange="toggleTypeFields('once')" class="peer sr-only">
              <div class="text-center py-1.5 text-xs font-bold border border-pink-200 rounded-xl peer-checked:bg-purple-400 peer-checked:text-white peer-checked:border-purple-400 transition text-slate-600">
                単発・SP番組
              </div>
            </label>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div id="field-weekly-day">
            <label class="block text-[11px] font-bold text-slate-500 mb-1">曜日 <span class="text-rose-400">*</span></label>
            <select id="input-day" class="w-full bg-pink-50/30 border border-pink-200/80 rounded-xl px-2.5 py-2 text-xs focus:ring-1 focus:ring-pink-400 outline-none">
              <option value="1">月曜日</option>
              <option value="2">火曜日</option>
              <option value="3">水曜日</option>
              <option value="4">木曜日</option>
              <option value="5">金曜日</option>
              <option value="6">土曜日</option>
              <option value="0">日曜日</option>
            </select>
          </div>

          <div id="field-once-date" class="hidden">
            <label class="block text-[11px] font-bold text-slate-500 mb-1">日付 <span class="text-rose-400">*</span></label>
            <input type="date" id="input-date" class="w-full bg-pink-50/30 border border-pink-200/80 rounded-xl px-2.5 py-2 text-xs focus:ring-1 focus:ring-pink-400 outline-none">
          </div>

          <div>
            <label class="block text-[11px] font-bold text-slate-500 mb-1">時間 <span class="text-rose-400">*</span></label>
            <input type="time" id="input-time" required class="w-full bg-pink-50/30 border border-pink-200/80 rounded-xl px-2.5 py-2 text-xs focus:ring-1 focus:ring-pink-400 outline-none">
          </div>
        </div>

        <div id="field-weekly-end" class="bg-pink-50/40 p-2.5 rounded-xl border border-pink-100">
          <label class="block text-[11px] font-bold text-pink-700 mb-1">放送終了日（任意）</label>
          <input type="date" id="input-end-date" class="w-full bg-white border border-pink-200/80 rounded-xl px-2.5 py-1.5 text-xs focus:ring-1 focus:ring-pink-400 outline-none">
        </div>

        <div>
          <label class="block text-[11px] font-bold text-slate-500 mb-1">番組名 <span class="text-rose-400">*</span></label>
          <input type="text" id="input-title" required placeholder="番組名を入力" class="w-full bg-pink-50/30 border border-pink-200/80 rounded-xl px-3 py-2 text-xs focus:ring-1 focus:ring-pink-400 outline-none">
        </div>

        <div>
          <div class="flex justify-between items-center mb-1">
            <label class="block text-[11px] font-bold text-slate-500">出演者</label>
            <span class="text-[10px] text-pink-400">（登録済みから選択可）</span>
          </div>
          <input type="text" id="input-cast" placeholder="出演者名" class="w-full bg-pink-50/30 border border-pink-200/80 rounded-xl px-3 py-2 text-xs focus:ring-1 focus:ring-pink-400 outline-none mb-1.5">
          <div id="quick-talent-list" class="flex flex-wrap gap-1 max-h-16 overflow-y-auto custom-scrollbar"></div>
        </div>

        <div>
          <label class="block text-[11px] font-bold text-slate-500 mb-1">備考メモ</label>
          <input type="text" id="input-memo" placeholder="局名、録画メモなど" class="w-full bg-pink-50/30 border border-pink-200/80 rounded-xl px-3 py-2 text-xs focus:ring-1 focus:ring-pink-400 outline-none">
        </div>

        <div>
          <div class="flex justify-between items-center mb-1">
            <label class="block text-[11px] font-bold text-slate-500">カラータグ</label>
            <button type="button" onclick="openAddTagPrompt()" class="text-[10px] text-pink-500 hover:underline font-bold">+ 新しい色を追加</button>
          </div>
          <div id="color-tag-container" class="flex flex-wrap gap-2 items-center"></div>
        </div>

        <div class="pt-2 flex items-center justify-end space-x-2 border-t border-pink-100">
          <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl border border-pink-200 text-xs font-bold text-slate-600 hover:bg-pink-50/50 transition">キャンセル</button>
          <button type="submit" class="px-4 py-2 rounded-xl bg-gradient-to-r from-pink-400 to-purple-400 text-white text-xs font-bold shadow-sm shadow-pink-200 transition">保存する</button>
        </div>
      </form>
    </div>
  </div>

  <!-- TALENT MANAGEMENT MODAL -->
  <div id="talent-modal-backdrop" class="fixed inset-0 bg-slate-900/20 backdrop-blur-xs z-50 flex items-center justify-center p-3 opacity-0 pointer-events-none transition-opacity duration-200">
    <div class="bg-white rounded-3xl shadow-xl border border-pink-100 w-full max-w-xs overflow-hidden p-5 space-y-3.5">
      <div class="flex items-center justify-between border-b border-pink-100 pb-2.5">
        <h3 class="font-bold text-slate-700 text-xs">タレント管理</h3>
        <button onclick="closeTalentModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-xs"></i></button>
      </div>

      <div class="flex gap-2">
        <input type="text" id="new-talent-name" placeholder="タレント・アイドル名" class="flex-1 bg-pink-50/30 border border-pink-200/80 rounded-xl px-3 py-1.5 text-xs focus:ring-1 focus:ring-pink-400 outline-none">
        <button onclick="addTalent()" class="bg-pink-400 text-white px-3 py-1.5 rounded-xl text-xs font-bold hover:bg-pink-500 transition shadow-sm shadow-pink-200">登録</button>
      </div>

      <div id="talent-manager-list" class="space-y-1.5 max-h-48 overflow-y-auto custom-scrollbar border-t border-pink-50 pt-2"></div>
    </div>
  </div>

  <!-- FIREBASE SDK & APP SCRIPT -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      signInWithEmailAndPassword, 
      createUserWithEmailAndPassword, 
      signOut, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, 
      doc, 
      getDoc, 
      setDoc 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyAoNZm6KwPQuWbC0W65sOh4soLMx1UoUrQ",
      authDomain: "g-account-6f48b.firebaseapp.com",
      projectId: "g-account-6f48b",
      storageBucket: "g-account-6f48b.firebasestorage.app",
      messagingSenderId: "719634797870",
      appId: "1:719634797870:web:5e6c3affbed118aa8d16bf",
      measurementId: "G-0WB2ZMX6K1"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Global App State
    window.currentUser = null;
    window.isLoginMode = true;
    window.currentView = 'calendar';
    window.currentDate = new Date();

    window.schedules = [];
    window.registeredTalents = [];
    window.customTags = [
      { id: 'tag-1', name: '通常', color: '#f472b6' },
      { id: 'tag-2', name: '推し', color: '#a78bfa' },
      { id: 'tag-3', name: '特番', color: '#38bdf8' }
    ];

    const dayNames = ['日', '月', '火', '水', '木', '金', '土'];

    // Helper: convert custom ID to dummy email format for Firebase Auth
    function getEmailFromUsername(username) {
      return `${username.trim().toLowerCase()}@tv-schedule.local`;
    }

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        window.currentUser = user;
        document.getElementById('auth-screen').classList.add('hidden');
        document.getElementById('app-container').classList.remove('hidden');
        await loadUserData();
      } else {
        window.currentUser = null;
        document.getElementById('auth-screen').classList.remove('hidden');
        document.getElementById('app-container').classList.add('hidden');
      }
    });

    window.toggleAuthMode = function() {
      window.isLoginMode = !window.isLoginMode;
      document.getElementById('auth-submit-btn').textContent = window.isLoginMode ? 'ログイン' : '新規登録';
      document.getElementById('auth-toggle-btn').textContent = window.isLoginMode ? 'アカウントをお持ちでない方は新規登録' : 'ログイン画面へ戻る';
      document.getElementById('auth-error').classList.add('hidden');
    };

    window.handleAuth = async function(e) {
      e.preventDefault();
      const usernameInput = document.getElementById('auth-username').value;
      const password = document.getElementById('auth-password').value;
      const errorEl = document.getElementById('auth-error');
      errorEl.classList.add('hidden');

      const email = getEmailFromUsername(usernameInput);

      try {
        if (window.isLoginMode) {
          await signInWithEmailAndPassword(auth, email, password);
        } else {
          await createUserWithEmailAndPassword(auth, email, password);
        }
      } catch (err) {
        let msg = err.message;
        if (err.code === 'auth/invalid-credential' || err.code === 'auth/user-not-found' || err.code === 'auth/wrong-password') {
          msg = 'IDまたはパスワードが間違っています';
        } else if (err.code === 'auth/email-already-in-use') {
          msg = 'このIDはすでに使われています';
        }
        errorEl.textContent = 'エラー: ' + msg;
        errorEl.classList.remove('hidden');
      }
    };

    window.handleLogout = function() { signOut(auth); };

    async function loadUserData() {
      if (!window.currentUser) return;
      try {
        const userDocRef = doc(db, 'users', window.currentUser.uid);
        const docSnap = await getDoc(userDocRef);

        if (docSnap.exists()) {
          const data = docSnap.data();
          window.schedules = data.schedules || [];
          window.registeredTalents = data.talents || [];
          window.customTags = data.customTags || window.customTags;
        } else {
          await saveUserData();
        }
        renderCalendar();
        renderTable();
        renderColorTags();
      } catch (err) {
        console.error(err);
      }
    }

    async function saveUserData() {
      if (!window.currentUser) return;
      try {
        const userDocRef = doc(db, 'users', window.currentUser.uid);
        await setDoc(userDocRef, {
          schedules: window.schedules,
          talents: window.registeredTalents,
          customTags: window.customTags
        });
      } catch (err) {
        console.error(err);
      }
    }

    window.saveData = function() {
      saveUserData();
      if (window.currentView === 'calendar') renderCalendar();
      else renderTable();
    };

    window.switchView = function(view) {
      window.currentView = view;
      const calendarView = document.getElementById('calendar-view');
      const tableView = document.getElementById('table-view');
      const calBtn = document.getElementById('view-calendar-btn');
      const tblBtn = document.getElementById('view-table-btn');

      if (view === 'calendar') {
        calendarView.classList.remove('hidden');
        tableView.classList.add('hidden');
        calBtn.className = 'px-3 py-1 rounded-lg transition-all flex items-center gap-1.5 bg-white text-pink-600 shadow-xs font-bold';
        tblBtn.className = 'px-3 py-1 rounded-lg transition-all flex items-center gap-1.5 hover:text-slate-900';
        renderCalendar();
      } else {
        calendarView.classList.add('hidden');
        tableView.classList.remove('hidden');
        tblBtn.className = 'px-3 py-1 rounded-lg transition-all flex items-center gap-1.5 bg-white text-pink-600 shadow-xs font-bold';
        calBtn.className = 'px-3 py-1 rounded-lg transition-all flex items-center gap-1.5 hover:text-slate-900';
        renderTable();
      }
    };

    window.openModal = function(presetDate = null) {
      document.getElementById('schedule-form').reset();
      document.getElementById('entry-id').value = '';
      document.getElementById('modal-title').textContent = '新しい番組予定を追加';
      
      document.querySelector('input[name="entry-type"][value="weekly"]').checked = true;
      toggleTypeFields('weekly');

      if (presetDate) {
        document.querySelector('input[name="entry-type"][value="once"]').checked = true;
        toggleTypeFields('once');
        document.getElementById('input-date').value = presetDate;
      }

      renderQuickTalents();
      renderColorTags();

      document.getElementById('modal-backdrop').classList.remove('opacity-0', 'pointer-events-none');
      document.getElementById('modal-panel').classList.remove('scale-95');
      document.getElementById('modal-panel').classList.add('scale-100');
    };

    window.closeModal = function() {
      document.getElementById('modal-backdrop').classList.add('opacity-0', 'pointer-events-none');
      document.getElementById('modal-panel').classList.remove('scale-100');
      document.getElementById('modal-panel').classList.add('scale-95');
    };

    window.toggleTypeFields = function(type) {
      document.getElementById('field-weekly-day').classList.toggle('hidden', type !== 'weekly');
      document.getElementById('field-once-date').classList.toggle('hidden', type !== 'once');
      document.getElementById('field-weekly-end').classList.toggle('hidden', type !== 'weekly');
    };

    window.toggleSkipDate = function(id, dateStr, e) {
      if (e) e.stopPropagation();
      const item = window.schedules.find(s => s.id === id);
      if (!item) return;

      if (!item.skippedDates) item.skippedDates = [];
      const index = item.skippedDates.indexOf(dateStr);
      if (index > -1) {
        item.skippedDates.splice(index, 1);
      } else {
        if (confirm(`${dateStr} の放送を「休止」に設定しますか？`)) {
          item.skippedDates.push(dateStr);
        } else {
          return;
        }
      }
      saveData();
    };

    window.renderColorTags = function() {
      const container = document.getElementById('color-tag-container');
      container.innerHTML = '';
      window.customTags.forEach((tag, idx) => {
        const label = document.createElement('label');
        label.className = 'cursor-pointer flex items-center gap-1.5 text-[11px] border border-pink-100 bg-pink-50/20 rounded-xl px-2 py-1 hover:bg-pink-50';
        label.innerHTML = `
          <input type="radio" name="color-tag" value="${tag.color}" ${idx === 0 ? 'checked' : ''} class="peer sr-only">
          <span class="w-3.5 h-3.5 rounded-full inline-block ring-2 ring-transparent peer-checked:ring-offset-1 peer-checked:ring-pink-400 transition" style="background-color: ${tag.color};"></span>
          <span class="text-slate-600 font-medium">${escapeHtml(tag.name)}</span>
        `;
        container.appendChild(label);
      });
    };

    window.openAddTagPrompt = function() {
      const tagName = prompt('カラータグの名前を入力:');
      if (!tagName) return;
      const tagColor = prompt('カラーコードを入力 (例: #f472b6):', '#f472b6');
      if (!tagColor) return;

      window.customTags.push({ id: 'tag-' + Date.now(), name: tagName, color: tagColor });
      saveUserData();
      renderColorTags();
    };

    window.openTalentModal = function() {
      renderTalentManagerList();
      document.getElementById('talent-modal-backdrop').classList.remove('opacity-0', 'pointer-events-none');
    };

    window.closeTalentModal = function() {
      document.getElementById('talent-modal-backdrop').classList.add('opacity-0', 'pointer-events-none');
    };

    window.addTalent = function() {
      const input = document.getElementById('new-talent-name');
      const name = input.value.trim();
      if (!name) return;

      if (!window.registeredTalents.includes(name)) {
        window.registeredTalents.push(name);
        saveUserData();
      }
      input.value = '';
      renderTalentManagerList();
    };

    window.removeTalent = function(name) {
      window.registeredTalents = window.registeredTalents.filter(t => t !== name);
      saveUserData();
      renderTalentManagerList();
    };

    function renderTalentManagerList() {
      const list = document.getElementById('talent-manager-list');
      list.innerHTML = '';
      if (window.registeredTalents.length === 0) {
        list.innerHTML = '<div class="text-slate-400 text-center py-2 text-[11px]">タレントが登録されていません</div>';
        return;
      }
      window.registeredTalents.forEach(t => {
        const item = document.createElement('div');
        item.className = 'flex items-center justify-between text-xs bg-pink-50/40 px-2.5 py-1.5 rounded-xl border border-pink-100';
        item.innerHTML = `
          <span class="font-medium text-slate-700">${escapeHtml(t)}</span>
          <button onclick="removeTalent('${escapeHtml(t)}')" class="text-slate-400 hover:text-rose-500"><i class="fa-solid fa-xmark"></i></button>
        `;
        list.appendChild(item);
      });
    }

    function renderQuickTalents() {
      const container = document.getElementById('quick-talent-list');
      container.innerHTML = '';
      if (window.registeredTalents.length === 0) return;

      window.registeredTalents.forEach(t => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'text-[10px] bg-pink-50 hover:bg-pink-100 text-pink-600 px-2 py-0.5 rounded-lg transition border border-pink-200/60 font-medium';
        btn.textContent = `+ ${t}`;
        btn.onclick = () => {
          const input = document.getElementById('input-cast');
          if (input.value) {
            if (!input.value.includes(t)) input.value += `, ${t}`;
          } else {
            input.value = t;
          }
        };
        container.appendChild(btn);
      });
    }

    window.editSchedule = function(id) {
      const item = window.schedules.find(s => s.id === id);
      if (!item) return;

      document.getElementById('entry-id').value = item.id;
      document.getElementById('modal-title').textContent = '番組予定を編集';

      document.querySelector(`input[name="entry-type"][value="${item.type}"]`).checked = true;
      toggleTypeFields(item.type);

      if (item.type === 'weekly') {
        document.getElementById('input-day').value = item.day;
        document.getElementById('input-end-date').value = item.endDate || '';
      } else {
        document.getElementById('input-date').value = item.date;
      }

      document.getElementById('input-time').value = item.time;
      document.getElementById('input-title').value = item.title;
      document.getElementById('input-cast').value = item.cast || '';
      document.getElementById('input-memo').value = item.memo || '';

      renderQuickTalents();
      renderColorTags();

      const colorRadio = document.querySelector(`input[name="color-tag"][value="${item.color}"]`);
      if (colorRadio) colorRadio.checked = true;

      document.getElementById('modal-backdrop').classList.remove('opacity-0', 'pointer-events-none');
      document.getElementById('modal-panel').classList.remove('scale-95');
      document.getElementById('modal-panel').classList.add('scale-100');
    };

    window.deleteSchedule = function(id) {
      if (confirm('この番組予定を削除しますか？')) {
        window.schedules = window.schedules.filter(s => s.id !== id);
        saveData();
      }
    };

    window.handleFormSubmit = function(e) {
      e.preventDefault();
      const id = document.getElementById('entry-id').value || Date.now().toString();
      const type = document.querySelector('input[name="entry-type"]:checked').value;
      const colorRadio = document.querySelector('input[name="color-tag"]:checked');
      const color = colorRadio ? colorRadio.value : '#f472b6';

      const existingItem = window.schedules.find(s => s.id === id);

      const newItem = {
        id,
        type,
        color,
        time: document.getElementById('input-time').value,
        title: document.getElementById('input-title').value,
        cast: document.getElementById('input-cast').value,
        memo: document.getElementById('input-memo').value,
        day: type === 'weekly' ? document.getElementById('input-day').value : null,
        endDate: type === 'weekly' ? (document.getElementById('input-end-date').value || null) : null,
        date: type === 'once' ? document.getElementById('input-date').value : null,
        skippedDates: existingItem ? (existingItem.skippedDates || []) : []
      };

      const existingIndex = window.schedules.findIndex(s => s.id === id);
      if (existingIndex > -1) {
        window.schedules[existingIndex] = newItem;
      } else {
        window.schedules.push(newItem);
      }

      saveData();
      closeModal();
    };

    window.prevMonth = function() { window.currentDate.setMonth(window.currentDate.getMonth() - 1); renderCalendar(); };
    window.nextMonth = function() { window.currentDate.setMonth(window.currentDate.getMonth() + 1); renderCalendar(); };
    window.todayMonth = function() { window.currentDate = new Date(); renderCalendar(); };

    function renderCalendar() {
      const year = window.currentDate.getFullYear();
      const month = window.currentDate.getMonth();

      document.getElementById('calendar-month-year').textContent = `${year}年 ${month + 1}月`;

      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      const grid = document.getElementById('calendar-grid');
      grid.innerHTML = '';

      for (let i = 0; i < firstDay; i++) {
        const emptyCell = document.createElement('div');
        emptyCell.className = 'bg-pink-50/20 p-1 border-b border-r border-pink-100 min-h-[90px]';
        grid.appendChild(emptyCell);
      }

      const todayStr = new Date().toISOString().split('T')[0];

      for (let day = 1; day <= daysInMonth; day++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const cellDate = new Date(year, month, day);
        const dayOfWeek = cellDate.getDay();
        const isToday = dateStr === todayStr;

        const cell = document.createElement('div');
        cell.className = `p-1 border-b border-r border-pink-100 relative group hover:bg-pink-50/40 transition flex flex-col justify-between min-h-[90px] ${isToday ? 'bg-pink-50/30' : ''}`;
        
        let dayNumColor = 'text-slate-700';
        if (dayOfWeek === 0) dayNumColor = 'text-rose-400 font-bold';
        if (dayOfWeek === 6) dayNumColor = 'text-sky-400 font-bold';

        const topRow = document.createElement('div');
        topRow.className = 'flex items-center justify-between mb-1';
        topRow.innerHTML = `
          <span class="${dayNumColor} ${isToday ? 'w-4 h-4 bg-pink-400 text-white rounded-full flex items-center justify-center font-bold text-[10px]' : 'text-[11px] font-bold'}">${day}</span>
          <button onclick="openModal('${dateStr}')" title="この日に予定を追加" class="opacity-0 group-hover:opacity-100 text-pink-400 hover:text-pink-600 w-4 h-4 rounded-lg hover:bg-white shadow-xs flex items-center justify-center transition">
            <i class="fa-solid fa-plus text-[9px]"></i>
          </button>
        `;
        cell.appendChild(topRow);

        const itemsContainer = document.createElement('div');
        itemsContainer.className = 'space-y-1 overflow-y-auto max-h-[75px] custom-scrollbar flex-1';

        const dayEvents = window.schedules.filter(s => {
          if (s.skippedDates && s.skippedDates.includes(dateStr)) return false;
          if (s.type === 'weekly') {
            if (parseInt(s.day) !== dayOfWeek) return false;
            if (s.endDate && dateStr > s.endDate) return false;
            return true;
          } else {
            return s.date === dateStr;
          }
        }).sort((a,b) => a.time.localeCompare(b.time));

        dayEvents.forEach(item => {
          const badge = document.createElement('div');
          badge.className = 'p-1 rounded-lg text-[10px] leading-tight cursor-pointer hover:opacity-90 transition text-white font-medium shadow-2xs flex items-center justify-between group/badge';
          badge.style.backgroundColor = item.color || '#f472b6';
          badge.onclick = () => editSchedule(item.id);

          badge.innerHTML = `
            <div class="truncate mr-1">
              <div>${item.time} ${escapeHtml(item.title)}</div>
              ${item.cast ? `<div class="text-[9px] opacity-90 truncate"><i class="fa-regular fa-user mr-0.5"></i>${escapeHtml(item.cast)}</div>` : ''}
            </div>
            <button onclick="toggleSkipDate('${item.id}', '${dateStr}', event)" title="この日のみ休止" class="opacity-0 group-hover/badge:opacity-100 hover:bg-black/20 p-0.5 rounded text-[9px] shrink-0 transition">
              <i class="fa-solid fa-xmark"></i>
            </button>
          `;
          itemsContainer.appendChild(badge);
        });

        cell.appendChild(itemsContainer);
        grid.appendChild(cell);
      }
    }

    function renderTable() {
      const tbody = document.getElementById('table-body');
      tbody.innerHTML = '';

      const query = document.getElementById('table-search').value.toLowerCase();
      const filterType = document.getElementById('table-filter-type').value;

      let filtered = window.schedules.filter(s => {
        if (filterType !== 'all' && s.type !== filterType) return false;
        
        const matchTitle = s.title.toLowerCase().includes(query);
        const matchCast = (s.cast || '').toLowerCase().includes(query);
        const matchMemo = (s.memo || '').toLowerCase().includes(query);
        return matchTitle || matchCast || matchMemo;
      });

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="text-center py-6 text-slate-400">番組予定がありません</td></tr>`;
        return;
      }

      filtered.forEach(item => {
        const tr = document.createElement('tr');
        tr.className = 'hover:bg-pink-50/30 transition border-b border-pink-50';

        let dateDisplay = '';
        if (item.type === 'weekly') {
          const endText = item.endDate ? ` (${item.endDate}まで)` : '';
          dateDisplay = `<span class="inline-flex items-center gap-1 font-bold text-pink-600 bg-pink-50 px-2 py-0.5 rounded-lg border border-pink-100"><i class="fa-solid fa-rotate-right text-[9px]"></i> 毎週${dayNames[item.day]} ${item.time}${endText}</span>`;
        } else {
          dateDisplay = `<span class="inline-flex items-center gap-1 font-bold text-purple-600 bg-purple-50 px-2 py-0.5 rounded-lg border border-purple-100"><i class="fa-regular fa-calendar text-[9px]"></i> ${item.date || '日付未定'} ${item.time}</span>`;
        }

        const colorDot = `<span class="w-2 h-2 rounded-full inline-block mr-1.5 shrink-0" style="background-color: ${item.color || '#f472b6'}"></span>`;
        
        let skipBadge = '';
        if (item.skippedDates && item.skippedDates.length > 0) {
          skipBadge = `<div class="text-[9px] text-amber-500 mt-0.5 font-medium"><i class="fa-solid fa-ban mr-0.5"></i>休止日: ${item.skippedDates.join(', ')}</div>`;
        }

        tr.innerHTML = `
          <td class="py-2 px-3.5 whitespace-nowrap text-[11px]">${dateDisplay}${skipBadge}</td>
          <td class="py-2 px-3.5 font-bold text-slate-700"><div class="flex items-center">${colorDot}${escapeHtml(item.title)}</div></td>
          <td class="py-2 px-3.5 text-slate-600">${item.cast ? `<span class="inline-flex items-center gap-1 text-[11px]"><i class="fa-regular fa-user text-pink-400"></i> ${escapeHtml(item.cast)}</span>` : '<span class="text-slate-300">-</span>'}</td>
          <td class="py-2 px-3.5 text-slate-500 max-w-xs truncate text-[11px]">${escapeHtml(item.memo || '-')}</td>
          <td class="py-2 px-3.5 text-right whitespace-nowrap space-x-1">
            <button onclick="editSchedule('${item.id}')" class="text-slate-400 hover:text-pink-500 p-1"><i class="fa-regular fa-pen-to-square"></i></button>
            <button onclick="deleteSchedule('${item.id}')" class="text-slate-400 hover:text-rose-500 p-1"><i class="fa-regular fa-trash-can"></i></button>
          </td>
        `;

        tbody.appendChild(tr);
      });
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
      });
    }
  </script>
</body>
</html>
