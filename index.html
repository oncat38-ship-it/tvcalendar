<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TV Schedule Manager</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts & FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'Noto Sans JP', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #f8fafc;
      color: #1e293b;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col font-sans antialiased selection:bg-indigo-500 selection:text-white text-xs">

  <!-- Header Section -->
  <header class="bg-white/90 backdrop-blur-md border-b border-slate-200 sticky top-0 z-30">
    <div class="max-w-6xl mx-auto px-4">
      <div class="flex items-center justify-between h-14">
        <!-- Logo / Title -->
        <div class="flex items-center space-x-2.5">
          <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white shadow-xs">
            <i class="fa-solid fa-tv text-sm"></i>
          </div>
          <span class="text-sm font-bold text-slate-800 tracking-tight">TV Schedule</span>
        </div>

        <!-- Mode Toggle & Add Button -->
        <div class="flex items-center space-x-2">
          <!-- View Switcher Tabs -->
          <div class="bg-slate-100 p-0.5 rounded-lg flex text-[11px] font-medium text-slate-600">
            <button id="view-calendar-btn" onclick="switchView('calendar')" class="px-2.5 py-1 rounded-md transition-all flex items-center gap-1 bg-white text-indigo-600 shadow-xs">
              <i class="fa-regular fa-calendar-days"></i>
              <span>カレンダー</span>
            </button>
            <button id="view-table-btn" onclick="switchView('table')" class="px-2.5 py-1 rounded-md transition-all flex items-center gap-1 hover:text-slate-900">
              <i class="fa-solid fa-list-check"></i>
              <span>リスト表</span>
            </button>
          </div>

          <!-- Talent Mgmt Button -->
          <button onclick="openTalentModal()" class="border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 px-2.5 py-1.5 rounded-lg text-xs font-medium transition flex items-center gap-1">
            <i class="fa-regular fa-user text-slate-400"></i>
            <span class="hidden sm:inline">タレント管理</span>
          </button>

          <!-- Add Schedule Button -->
          <button onclick="openModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1.5 rounded-lg text-xs font-medium shadow-xs transition flex items-center gap-1">
            <i class="fa-solid fa-plus text-[10px]"></i>
            <span>追加</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="flex-1 max-w-6xl w-full mx-auto px-4 py-4">

    <!-- CALENDAR VIEW -->
    <section id="calendar-view" class="space-y-3">
      <!-- Calendar Controls -->
      <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-xs flex items-center justify-between">
        <div class="flex items-center space-x-2">
          <h2 id="calendar-month-year" class="text-sm font-bold text-slate-800">2026年 10月</h2>
          <div class="flex items-center bg-slate-100 rounded-lg p-0.5 text-[11px] text-slate-600">
            <button onclick="prevMonth()" class="px-2 py-0.5 rounded hover:bg-white transition"><i class="fa-solid fa-chevron-left"></i></button>
            <button onclick="todayMonth()" class="px-2 py-0.5 font-medium hover:bg-white transition">今月</button>
            <button onclick="nextMonth()" class="px-2 py-0.5 rounded hover:bg-white transition"><i class="fa-solid fa-chevron-right"></i></button>
          </div>
        </div>

        <!-- Filter Tags Info -->
        <div class="flex items-center gap-3 text-[11px] font-medium text-slate-500">
          <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-indigo-500 inline-block"></span>毎週</span>
          <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-rose-500 inline-block"></span>単発/SP</span>
        </div>
      </div>

      <!-- Calendar Grid Box -->
      <div class="bg-white rounded-xl border border-slate-200 shadow-xs overflow-hidden">
        <!-- Weekday Headers -->
        <div class="grid grid-cols-7 border-b border-slate-100 bg-slate-50/50 text-center text-[11px] font-semibold text-slate-500 py-1.5">
          <span class="text-rose-500">日</span>
          <span>月</span>
          <span>火</span>
          <span>水</span>
          <span>木</span>
          <span>金</span>
          <span class="text-sky-500">土</span>
        </div>

        <!-- Days Grid -->
        <div id="calendar-grid" class="grid grid-cols-7 auto-rows-fr divide-x divide-y divide-slate-100 min-h-[460px]">
          <!-- Dynamic Calendar Cells -->
        </div>
      </div>
    </section>

    <!-- TABLE VIEW (Compact & Smart) -->
    <section id="table-view" class="space-y-3 hidden">
      <!-- Search and Filter Bar -->
      <div class="bg-white p-2.5 rounded-xl border border-slate-200 shadow-xs flex flex-wrap gap-2 items-center justify-between">
        <div class="relative w-full sm:w-64">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-[11px]"></i>
          <input type="text" id="table-search" oninput="renderTable()" placeholder="検索..." 
                 class="w-full pl-8 pr-3 py-1 bg-slate-50 border border-slate-200 rounded-lg text-xs focus:outline-none focus:ring-1 focus:ring-indigo-500 focus:bg-white transition">
        </div>

        <div class="flex items-center gap-2">
          <select id="table-filter-type" onchange="renderTable()" class="bg-slate-50 border border-slate-200 text-xs text-slate-600 rounded-lg px-2.5 py-1 focus:outline-none focus:ring-1 focus:ring-indigo-500">
            <option value="all">すべての番組</option>
            <option value="weekly">毎週の番組</option>
            <option value="once">単発・SP番組</option>
          </select>
        </div>
      </div>

      <!-- Compact Table Box -->
      <div class="bg-white rounded-xl border border-slate-200 shadow-xs overflow-hidden">
        <div class="overflow-x-auto custom-scrollbar">
          <table class="w-full text-left text-xs border-collapse">
            <thead class="bg-slate-50 border-b border-slate-200 text-slate-500 font-medium">
              <tr>
                <th class="py-2 px-3 w-28">放送日時</th>
                <th class="py-2 px-3">番組名</th>
                <th class="py-2 px-3">出演者</th>
                <th class="py-2 px-3">備考</th>
                <th class="py-2 px-3 w-16 text-right">操作</th>
              </tr>
            </thead>
            <tbody id="table-body" class="divide-y divide-slate-100 text-slate-700">
              <!-- Dynamic Rows -->
            </tbody>
          </table>
        </div>
      </div>
    </section>

  </main>

  <!-- ADD / EDIT SCHEDULE MODAL -->
  <div id="modal-backdrop" class="fixed inset-0 bg-slate-900/30 backdrop-blur-xs z-50 flex items-center justify-center p-3 opacity-0 pointer-events-none transition-opacity duration-200">
    <div id="modal-panel" class="bg-white rounded-xl shadow-lg border border-slate-200 w-full max-w-sm overflow-hidden transform scale-95 transition-all duration-200">
      
      <!-- Modal Header -->
      <div class="px-4 py-3 border-b border-slate-100 flex items-center justify-between">
        <h3 id="modal-title" class="font-bold text-slate-800 text-xs">新しい番組予定を追加</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 w-6 h-6 rounded-full flex items-center justify-center hover:bg-slate-100 transition">
          <i class="fa-solid fa-xmark text-xs"></i>
        </button>
      </div>

      <!-- Modal Form -->
      <form id="schedule-form" onsubmit="handleFormSubmit(event)" class="p-4 space-y-3">
        <input type="hidden" id="entry-id">

        <!-- Type Selector -->
        <div>
          <div class="grid grid-cols-2 gap-1.5">
            <label class="cursor-pointer">
              <input type="radio" name="entry-type" value="weekly" checked onchange="toggleTypeFields('weekly')" class="peer sr-only">
              <div class="text-center py-1 text-xs font-medium border border-slate-200 rounded-lg peer-checked:bg-indigo-50 peer-checked:border-indigo-500 peer-checked:text-indigo-700 transition">
                毎週の番組
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="entry-type" value="once" onchange="toggleTypeFields('once')" class="peer sr-only">
              <div class="text-center py-1 text-xs font-medium border border-slate-200 rounded-lg peer-checked:bg-rose-50 peer-checked:border-rose-500 peer-checked:text-rose-700 transition">
                単発・SP番組
              </div>
            </label>
          </div>
        </div>

        <!-- Date & Time Inputs -->
        <div class="grid grid-cols-2 gap-2">
          <!-- Day of Week -->
          <div id="field-weekly-day">
            <label class="block text-[11px] font-medium text-slate-500 mb-0.5">曜日 <span class="text-rose-500">*</span></label>
            <select id="input-day" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-2.5 py-1.5 text-xs focus:ring-1 focus:ring-indigo-500 focus:bg-white outline-none">
              <option value="1">月曜日</option>
              <option value="2">火曜日</option>
              <option value="3">水曜日</option>
              <option value="4">木曜日</option>
              <option value="5">金曜日</option>
              <option value="6">土曜日</option>
              <option value="0">日曜日</option>
            </select>
          </div>

          <!-- Specific Date -->
          <div id="field-once-date" class="hidden">
            <label class="block text-[11px] font-medium text-slate-500 mb-0.5">日付 <span class="text-rose-500">*</span></label>
            <input type="date" id="input-date" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-2.5 py-1.5 text-xs focus:ring-1 focus:ring-indigo-500 focus:bg-white outline-none">
          </div>

          <!-- Time Input -->
          <div>
            <label class="block text-[11px] font-medium text-slate-500 mb-0.5">時間 <span class="text-rose-500">*</span></label>
            <input type="time" id="input-time" required class="w-full bg-slate-50 border border-slate-200 rounded-lg px-2.5 py-1.5 text-xs focus:ring-1 focus:ring-indigo-500 focus:bg-white outline-none">
          </div>
        </div>

        <!-- Title -->
        <div>
          <label class="block text-[11px] font-medium text-slate-500 mb-0.5">番組名 <span class="text-rose-500">*</span></label>
          <input type="text" id="input-title" required placeholder="番組名を入力" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-2.5 py-1.5 text-xs focus:ring-1 focus:ring-indigo-500 focus:bg-white outline-none">
        </div>

        <!-- Cast / Idols -->
        <div>
          <div class="flex justify-between items-center mb-0.5">
            <label class="block text-[11px] font-medium text-slate-500">出演者</label>
            <span class="text-[10px] text-slate-400">（登録済みから選択可）</span>
          </div>
          <input type="text" id="input-cast" placeholder="出演者名（カンマ区切り可）" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-2.5 py-1.5 text-xs focus:ring-1 focus:ring-indigo-500 focus:bg-white outline-none mb-1.5">
          
          <!-- Registered Talent Quick Select Buttons -->
          <div id="quick-talent-list" class="flex flex-wrap gap-1 max-h-16 overflow-y-auto custom-scrollbar">
            <!-- Dynamic Talent Quick Buttons -->
          </div>
        </div>

        <!-- Notes / Channel -->
        <div>
          <label class="block text-[11px] font-medium text-slate-500 mb-0.5">備考メモ</label>
          <input type="text" id="input-memo" placeholder="局名、録画メモなど" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-2.5 py-1.5 text-xs focus:ring-1 focus:ring-indigo-500 focus:bg-white outline-none">
        </div>

        <!-- Dynamic Custom Color Tag Selector -->
        <div>
          <div class="flex justify-between items-center mb-1">
            <label class="block text-[11px] font-medium text-slate-500">カラータグ</label>
            <button type="button" onclick="openAddTagPrompt()" class="text-[10px] text-indigo-600 hover:underline">+ 新しい色を追加</button>
          </div>
          <div id="color-tag-container" class="flex flex-wrap gap-2 items-center">
            <!-- Dynamic Color Tag Radios -->
          </div>
        </div>

        <!-- Form Buttons -->
        <div class="pt-2 flex items-center justify-end space-x-2 border-t border-slate-100">
          <button type="button" onclick="closeModal()" class="px-3 py-1.5 rounded-lg border border-slate-200 text-xs text-slate-600 hover:bg-slate-50 transition">キャンセル</button>
          <button type="submit" class="px-3 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-medium shadow-xs transition">保存する</button>
        </div>
      </form>
    </div>
  </div>

  <!-- TALENT MANAGEMENT MODAL -->
  <div id="talent-modal-backdrop" class="fixed inset-0 bg-slate-900/30 backdrop-blur-xs z-50 flex items-center justify-center p-3 opacity-0 pointer-events-none transition-opacity duration-200">
    <div class="bg-white rounded-xl shadow-lg border border-slate-200 w-full max-w-xs overflow-hidden p-4 space-y-3">
      <div class="flex items-center justify-between border-b border-slate-100 pb-2">
        <h3 class="font-bold text-slate-800 text-xs">タレント管理</h3>
        <button onclick="closeTalentModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-xs"></i></button>
      </div>

      <div class="flex gap-1.5">
        <input type="text" id="new-talent-name" placeholder="タレント・アイドル名" class="flex-1 bg-slate-50 border border-slate-200 rounded-lg px-2.5 py-1 text-xs focus:ring-1 focus:ring-indigo-500 outline-none">
        <button onclick="addTalent()" class="bg-indigo-600 text-white px-2.5 py-1 rounded-lg text-xs font-medium hover:bg-indigo-700 transition">登録</button>
      </div>

      <div id="talent-manager-list" class="space-y-1 max-h-48 overflow-y-auto custom-scrollbar border-t border-slate-100 pt-2">
        <!-- Dynamic Managed Talents -->
      </div>
    </div>
  </div>

  <!-- APPLICATION JAVASCRIPT -->
  <script>
    // State Management
    let currentView = 'calendar';
    let currentDate = new Date();
    
    // Empty default states
    let schedules = JSON.parse(localStorage.getItem('tv_schedules_data')) || [];
    let customTags = JSON.parse(localStorage.getItem('tv_custom_tags')) || [
      { id: 'tag-1', name: '通常', color: '#6366f1' },
      { id: 'tag-2', name: '推し', color: '#f43f5e' },
      { id: 'tag-3', name: '特番', color: '#10b981' }
    ];
    let registeredTalents = JSON.parse(localStorage.getItem('tv_talents_data')) || [];

    const dayNames = ['日', '月', '火', '水', '木', '金', '土'];

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      renderCalendar();
      renderTable();
      renderColorTags();
    });

    // View Switcher
    function switchView(view) {
      currentView = view;
      const calendarView = document.getElementById('calendar-view');
      const tableView = document.getElementById('table-view');
      const calBtn = document.getElementById('view-calendar-btn');
      const tblBtn = document.getElementById('view-table-btn');

      if (view === 'calendar') {
        calendarView.classList.remove('hidden');
        tableView.classList.add('hidden');
        calBtn.className = 'px-2.5 py-1 rounded-md transition-all flex items-center gap-1 bg-white text-indigo-600 shadow-xs';
        tblBtn.className = 'px-2.5 py-1 rounded-md transition-all flex items-center gap-1 hover:text-slate-900';
        renderCalendar();
      } else {
        calendarView.classList.add('hidden');
        tableView.classList.remove('hidden');
        tblBtn.className = 'px-2.5 py-1 rounded-md transition-all flex items-center gap-1 bg-white text-indigo-600 shadow-xs';
        calBtn.className = 'px-2.5 py-1 rounded-md transition-all flex items-center gap-1 hover:text-slate-900';
        renderTable();
      }
    }

    // Modal Operations
    function openModal(presetDate = null) {
      document.getElementById('schedule-form').reset();
      document.getElementById('entry-id').value = '';
      document.getElementById('modal-title').textContent = '新しい番組予定を追加';
      
      document.querySelector('input[name="entry-type"][value="weekly"]').checked = true;
      toggleTypeFields('weekly');

      if (presetDate) {
        document.querySelector('input[name="entry-type"][value="once"]').checked = true;
        toggleTypeFields('once');
        document.getElementById('input-date').value = presetDate;
      }

      renderQuickTalents();
      renderColorTags();

      const backdrop = document.getElementById('modal-backdrop');
      const panel = document.getElementById('modal-panel');
      backdrop.classList.remove('opacity-0', 'pointer-events-none');
      panel.classList.remove('scale-95');
      panel.classList.add('scale-100');
    }

    function closeModal() {
      const backdrop = document.getElementById('modal-backdrop');
      const panel = document.getElementById('modal-panel');
      backdrop.classList.add('opacity-0', 'pointer-events-none');
      panel.classList.remove('scale-100');
      panel.classList.add('scale-95');
    }

    function toggleTypeFields(type) {
      const weeklyField = document.getElementById('field-weekly-day');
      const onceField = document.getElementById('field-once-date');
      if (type === 'weekly') {
        weeklyField.classList.remove('hidden');
        onceField.classList.add('hidden');
      } else {
        weeklyField.classList.add('hidden');
        onceField.classList.remove('hidden');
      }
    }

    // Color Tag Render & Custom Tag Addition
    function renderColorTags() {
      const container = document.getElementById('color-tag-container');
      container.innerHTML = '';

      customTags.forEach((tag, idx) => {
        const label = document.createElement('label');
        label.className = 'cursor-pointer flex items-center gap-1 text-[11px] border border-slate-200 rounded-md px-1.5 py-0.5 hover:bg-slate-50';
        label.innerHTML = `
          <input type="radio" name="color-tag" value="${tag.color}" ${idx === 0 ? 'checked' : ''} class="peer sr-only">
          <span class="w-3 h-3 rounded-full inline-block ring-1 ring-black/10 peer-checked:ring-2 peer-checked:ring-offset-1 peer-checked:ring-indigo-600" style="background-color: ${tag.color};"></span>
          <span class="text-slate-600">${escapeHtml(tag.name)}</span>
        `;
        container.appendChild(label);
      });
    }

    function openAddTagPrompt() {
      const tagName = prompt('カラータグの名前（ジャンルなど）を入力してください:');
      if (!tagName) return;

      const tagColor = prompt('カラーコード（例: #f59e0b や #ec4899）を入力してください:', '#3b82f6');
      if (!tagColor) return;

      const newTag = {
        id: 'tag-' + Date.now(),
        name: tagName,
        color: tagColor
      };

      customTags.push(newTag);
      localStorage.setItem('tv_custom_tags', JSON.stringify(customTags));
      renderColorTags();
    }

    // Talent Management
    function openTalentModal() {
      renderTalentManagerList();
      const backdrop = document.getElementById('talent-modal-backdrop');
      backdrop.classList.remove('opacity-0', 'pointer-events-none');
    }

    function closeTalentModal() {
      const backdrop = document.getElementById('talent-modal-backdrop');
      backdrop.classList.add('opacity-0', 'pointer-events-none');
    }

    function addTalent() {
      const nameInput = document.getElementById('new-talent-name');
      const name = nameInput.value.trim();
      if (!name) return;

      if (!registeredTalents.includes(name)) {
        registeredTalents.push(name);
        localStorage.setItem('tv_talents_data', JSON.stringify(registeredTalents));
      }
      nameInput.value = '';
      renderTalentManagerList();
    }

    function removeTalent(name) {
      registeredTalents = registeredTalents.filter(t => t !== name);
      localStorage.setItem('tv_talents_data', JSON.stringify(registeredTalents));
      renderTalentManagerList();
    }

    function renderTalentManagerList() {
      const list = document.getElementById('talent-manager-list');
      list.innerHTML = '';
      if (registeredTalents.length === 0) {
        list.innerHTML = '<div class="text-slate-400 text-center py-2 text-[11px]">登録されているタレントはいません</div>';
        return;
      }
      registeredTalents.forEach(t => {
        const item = document.createElement('div');
        item.className = 'flex items-center justify-between text-xs bg-slate-50 px-2 py-1 rounded border border-slate-100';
        item.innerHTML = `
          <span>${escapeHtml(t)}</span>
          <button onclick="removeTalent('${escapeHtml(t)}')" class="text-slate-400 hover:text-rose-500"><i class="fa-solid fa-xmark"></i></button>
        `;
        list.appendChild(item);
      });
    }

    function renderQuickTalents() {
      const container = document.getElementById('quick-talent-list');
      container.innerHTML = '';
      if (registeredTalents.length === 0) return;

      registeredTalents.forEach(t => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'text-[10px] bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 text-slate-600 px-2 py-0.5 rounded transition border border-slate-200/60';
        btn.textContent = `+ ${t}`;
        btn.onclick = () => {
          const input = document.getElementById('input-cast');
          if (input.value) {
            if (!input.value.includes(t)) input.value += `, ${t}`;
          } else {
            input.value = t;
          }
        };
        container.appendChild(btn);
      });
    }

    // Edit Item
    function editSchedule(id) {
      const item = schedules.find(s => s.id === id);
      if (!item) return;

      document.getElementById('entry-id').value = item.id;
      document.getElementById('modal-title').textContent = '番組予定を編集';

      document.querySelector(`input[name="entry-type"][value="${item.type}"]`).checked = true;
      toggleTypeFields(item.type);

      if (item.type === 'weekly') {
        document.getElementById('input-day').value = item.day;
      } else {
        document.getElementById('input-date').value = item.date;
      }

      document.getElementById('input-time').value = item.time;
      document.getElementById('input-title').value = item.title;
      document.getElementById('input-cast').value = item.cast || '';
      document.getElementById('input-memo').value = item.memo || '';

      renderQuickTalents();
      renderColorTags();

      const colorRadio = document.querySelector(`input[name="color-tag"][value="${item.color}"]`);
      if (colorRadio) colorRadio.checked = true;

      const backdrop = document.getElementById('modal-backdrop');
      const panel = document.getElementById('modal-panel');
      backdrop.classList.remove('opacity-0', 'pointer-events-none');
      panel.classList.remove('scale-95');
      panel.classList.add('scale-100');
    }

    // Delete Item
    function deleteSchedule(id) {
      if (confirm('この番組予定を削除しますか？')) {
        schedules = schedules.filter(s => s.id !== id);
        saveData();
      }
    }

    // Handle Form Submit
    function handleFormSubmit(e) {
      e.preventDefault();
      const id = document.getElementById('entry-id').value || Date.now().toString();
      const type = document.querySelector('input[name="entry-type"]:checked').value;
      const colorRadio = document.querySelector('input[name="color-tag"]:checked');
      const color = colorRadio ? colorRadio.value : '#6366f1';

      const newItem = {
        id,
        type,
        color,
        time: document.getElementById('input-time').value,
        title: document.getElementById('input-title').value,
        cast: document.getElementById('input-cast').value,
        memo: document.getElementById('input-memo').value,
        day: type === 'weekly' ? document.getElementById('input-day').value : null,
        date: type === 'once' ? document.getElementById('input-date').value : null
      };

      const existingIndex = schedules.findIndex(s => s.id === id);
      if (existingIndex > -1) {
        schedules[existingIndex] = newItem;
      } else {
        schedules.push(newItem);
      }

      saveData();
      closeModal();
    }

    function saveData() {
      localStorage.setItem('tv_schedules_data', JSON.stringify(schedules));
      if (currentView === 'calendar') renderCalendar();
      else renderTable();
    }

    // CALENDAR RENDER LOGIC
    function prevMonth() {
      currentDate.setMonth(currentDate.getMonth() - 1);
      renderCalendar();
    }
    function nextMonth() {
      currentDate.setMonth(currentDate.getMonth() + 1);
      renderCalendar();
    }
    function todayMonth() {
      currentDate = new Date();
      renderCalendar();
    }

    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      document.getElementById('calendar-month-year').textContent = `${year}年 ${month + 1}月`;

      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      const grid = document.getElementById('calendar-grid');
      grid.innerHTML = '';

      for (let i = 0; i < firstDay; i++) {
        const emptyCell = document.createElement('div');
        emptyCell.className = 'bg-slate-50/30 p-1 border-b border-r border-slate-100 min-h-[90px]';
        grid.appendChild(emptyCell);
      }

      const todayStr = new Date().toISOString().split('T')[0];

      for (let day = 1; day <= daysInMonth; day++) {
        const cellDate = new Date(year, month, day);
        const dayOfWeek = cellDate.getDay();
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const isToday = dateStr === todayStr;

        const cell = document.createElement('div');
        cell.className = `p-1 border-b border-r border-slate-100 relative group hover:bg-slate-50/80 transition flex flex-col justify-between min-h-[90px] ${isToday ? 'bg-indigo-50/20' : ''}`;
        
        let dayNumColor = 'text-slate-700';
        if (dayOfWeek === 0) dayNumColor = 'text-rose-500 font-medium';
        if (dayOfWeek === 6) dayNumColor = 'text-sky-500 font-medium';

        const topRow = document.createElement('div');
        topRow.className = 'flex items-center justify-between mb-1';
        topRow.innerHTML = `
          <span class="${dayNumColor} ${isToday ? 'w-4 h-4 bg-indigo-600 text-white rounded-full flex items-center justify-center font-bold text-[10px]' : 'text-[11px] font-semibold'}">${day}</span>
          <button onclick="openModal('${dateStr}')" title="この日に予定を追加" class="opacity-0 group-hover:opacity-100 text-slate-400 hover:text-indigo-600 w-4 h-4 rounded hover:bg-white shadow-xs flex items-center justify-center transition">
            <i class="fa-solid fa-plus text-[9px]"></i>
          </button>
        `;
        cell.appendChild(topRow);

        const itemsContainer = document.createElement('div');
        itemsContainer.className = 'space-y-1 overflow-y-auto max-h-[75px] custom-scrollbar flex-1';

        const dayEvents = schedules.filter(s => {
          if (s.type === 'weekly') {
            return parseInt(s.day) === dayOfWeek;
          } else {
            return s.date === dateStr;
          }
        }).sort((a,b) => a.time.localeCompare(b.time));

        dayEvents.forEach(item => {
          const badge = document.createElement('div');
          badge.className = 'p-1 rounded text-[10px] leading-tight cursor-pointer hover:opacity-80 transition text-white font-medium shadow-2xs';
          badge.style.backgroundColor = item.color || '#6366f1';
          badge.onclick = (e) => {
            e.stopPropagation();
            editSchedule(item.id);
          };

          badge.innerHTML = `
            <div class="truncate"><span>${item.time} ${escapeHtml(item.title)}</span></div>
            ${item.cast ? `<div class="text-[9px] opacity-90 truncate"><i class="fa-regular fa-user mr-0.5"></i>${escapeHtml(item.cast)}</div>` : ''}
          `;
          itemsContainer.appendChild(badge);
        });

        cell.appendChild(itemsContainer);
        grid.appendChild(cell);
      }
    }

    // COMPACT TABLE RENDER LOGIC
    function renderTable() {
      const tbody = document.getElementById('table-body');
      tbody.innerHTML = '';

      const query = document.getElementById('table-search').value.toLowerCase();
      const filterType = document.getElementById('table-filter-type').value;

      let filtered = schedules.filter(s => {
        if (filterType !== 'all' && s.type !== filterType) return false;
        
        const matchTitle = s.title.toLowerCase().includes(query);
        const matchCast = (s.cast || '').toLowerCase().includes(query);
        const matchMemo = (s.memo || '').toLowerCase().includes(query);
        return matchTitle || matchCast || matchMemo;
      });

      if (filtered.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="5" class="text-center py-6 text-slate-400">
              番組予定がありません
            </td>
          </tr>
        `;
        return;
      }

      filtered.forEach(item => {
        const tr = document.createElement('tr');
        tr.className = 'hover:bg-slate-50/80 transition border-b border-slate-100';

        let dateDisplay = '';
        if (item.type === 'weekly') {
          dateDisplay = `<span class="inline-flex items-center gap-1 font-semibold text-indigo-700 bg-indigo-50 px-1.5 py-0.5 rounded border border-indigo-100"><i class="fa-solid fa-rotate-right text-[9px]"></i> 毎週${dayNames[item.day]} ${item.time}</span>`;
        } else {
          dateDisplay = `<span class="inline-flex items-center gap-1 font-semibold text-rose-700 bg-rose-50 px-1.5 py-0.5 rounded border border-rose-100"><i class="fa-regular fa-calendar text-[9px]"></i> ${item.date || '日付未定'} ${item.time}</span>`;
        }

        const colorDot = `<span class="w-2 h-2 rounded-full inline-block mr-1.5 shrink-0" style="background-color: ${item.color || '#6366f1'}"></span>`;

        tr.innerHTML = `
          <td class="py-1.5 px-3 whitespace-nowrap text-[11px]">${dateDisplay}</td>
          <td class="py-1.5 px-3 font-semibold text-slate-800"><div class="flex items-center">${colorDot}${escapeHtml(item.title)}</div></td>
          <td class="py-1.5 px-3 text-slate-600">${item.cast ? `<span class="inline-flex items-center gap-1 text-[11px]"><i class="fa-regular fa-user text-slate-400"></i> ${escapeHtml(item.cast)}</span>` : '<span class="text-slate-300">-</span>'}</td>
          <td class="py-1.5 px-3 text-slate-500 max-w-xs truncate text-[11px]">${escapeHtml(item.memo || '-')}</td>
          <td class="py-1.5 px-3 text-right whitespace-nowrap space-x-1">
            <button onclick="editSchedule('${item.id}')" class="text-slate-400 hover:text-indigo-600 p-0.5"><i class="fa-regular fa-pen-to-square"></i></button>
            <button onclick="deleteSchedule('${item.id}')" class="text-slate-400 hover:text-rose-600 p-0.5"><i class="fa-regular fa-trash-can"></i></button>
          </td>
        `;

        tbody.appendChild(tr);
      });
    }

    // HTML Escaper
    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
      });
    }
  </script>
</body>
</html>
